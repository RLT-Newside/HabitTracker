name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - none

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Get version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Install CocoaPods-free Android deps
        working-directory: android
        run: ./gradlew --no-daemon dependencies || true

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          mv "$APK_PATH" "JHabits-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JHabits-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          path: JHabits-*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}+${{ steps.version.outputs.date }}.${{ steps.version.outputs.short_sha }}
          name: Release v${{ steps.version.outputs.version }} (${{ steps.version.outputs.date }})
          files: JHabits-*.apk
          generate_release_notes: true
          make_latest: true

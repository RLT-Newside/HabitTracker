name: Build Beta Release

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-beta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Get version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          mv "$APK_PATH" "JHabits-v${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.build_num }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JHabits-beta-${{ steps.version.outputs.short_sha }}
          path: JHabits-*.apk
          retention-days: 14

      - name: Create Beta Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.build_num }}
          name: Beta v${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.build_num }}
          files: JHabits-*.apk
          generate_release_notes: true
          prerelease: true

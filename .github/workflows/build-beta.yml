name: Build Beta Release

on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Build beta APK?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'

jobs:
  build-beta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/JHabits-v${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.build_num }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JHabits-beta-${{ steps.version.outputs.short_sha }}
          path: android/app/build/outputs/apk/release/JHabits-*.apk
          retention-days: 14

      - name: Create Beta Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.build_num }}
          name: Beta v${{ steps.version.outputs.version }}-beta.${{ steps.version.outputs.build_num }}
          files: android/app/build/outputs/apk/release/JHabits-*.apk
          generate_release_notes: true
          prerelease: true

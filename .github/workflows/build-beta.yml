name: Beta Release

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  beta-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate beta version
        id: version
        run: |
          BUILD_NUM=$(git rev-list --count HEAD)
          VERSION="0.0.${BUILD_NUM}-beta"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor & Build APK
        run: |
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/jhabits.keystore

      - name: Sign APK
        run: |
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="JHabits-${{ steps.version.outputs.tag }}.apk"
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner sign \
            --ks /tmp/jhabits.keystore \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --out "$SIGNED" \
            "$UNSIGNED"

      - name: Create beta pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.version.outputs.tag }}" 2>/dev/null || true
          git push origin "${{ steps.version.outputs.tag }}" 2>/dev/null || true
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "JHabits Beta ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --prerelease \
            JHabits-*.apk
